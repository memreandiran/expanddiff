defaults:
  - dataset: hdrplus_linrgb
  - model/rgb_guidance_module: edsr # edsr
  - override hydra/launcher: slurm_rich
  - _self_
  
general:
  lr_scheduler: 'linear' # linear, cosine
  lr: 1e-4
  weight_decay: 0.0
  schedule_sampler: "uniform"
  max_steps: 70000
  drop_rate: 0.0
  save_interval: 1000
  checkpoint: true
  suffix: null

  weight_l2: 1.0
  weight_l1: 1.0
  weight_logl1: 1.0
  weight_pul1: 0.0   # Aydin PU-encoded L1, off by default. Set >0 (e.g. 1.0) and
                     # set weight_logl1=0.0 to swap log-L1 for PU-L1.

  check_val_every_n_epoch: 1
  eval_diffusion_process_interval: 5
  log_train_images_interval: 500

  val_sampling_frequency: 20 # number of batches that are evaluated per validation
  log_val_sampling_images_interval: 4 # number of log batches: val_sampling_frequency / log_val_sampling_images_interval
  min_mode: 'black_level' # min_value, black_level
  
  seed: 0
  image_size: 256
  is_linear: false  # true = linear-RGB pipeline, false = 8-bit sRGB pipeline.
                    # Controls viz gamma encoding and LPIPS input pre-processing.
  clip_loss_weight: 0.0  # Spatial loss re-weighting toward clipped regions:
                    # pixel weight = (1-w) + w*mask, so 0.0 is a uniform loss
                    # and 1.0 trains only where the input is saturated/crushed.
                    # Pair with the --blend post-process in metrics/align.py.
  clip_loss_thr: 0.05  # width of the soft ramp
  clip_mask_channel: false  # Append the soft clip mask as a 4th guidance
                    # channel. The mask is computed from the guidance alone.
                    # Requires model.rgb_guidance_module.n_colors=4.
  target_encoding: none  # none | pu21. "none" trains against linear targets.
                    # "pu21" trains against perceptually-uniform targets,
                    # bounded in [0,1], and lets the model represent
                    # scene-referred radiance once decoded at inference.
                    # Requires is_linear=true and weight_logl1=weight_pul1=0.

model:
  _target_: rawdiffusion.models.rawdiffusion.RAWDiffusionModel

  model_channels: 32
  num_res_blocks: 2
  num_heads: 4
  num_heads_upsample: -1
  num_head_channels: 64
  attention_resolutions: "16,8"
  channel_mult: ""
  dropout: 0.0
  use_checkpoint: True
  use_scale_shift_norm: True
  resblock_updown: True
  use_new_attention_order: False
  in_channels: 3
  out_channels: 3
  mid_attention: True
  c_channels: 64
  out_tanh: True
  latent_drop_rate: 0.0
  conditional_block_name: RGBGuidedResidualBlock
  norm_num_groups: 8

diffusion:
  learn_sigma: False
  steps: 1000
  noise_schedule: linear
  timestep_respacing: ""
  use_kl: False
  predict_xstart: True
  rescale_timesteps: False
  rescale_learned_sigmas: False

diffusion_val:
  learn_sigma: ${diffusion.learn_sigma}
  steps: ${diffusion.steps}
  noise_schedule: ${diffusion.noise_schedule}
  timestep_respacing: ddim24
  use_kl: ${diffusion.use_kl}
  predict_xstart: ${diffusion.predict_xstart}
  rescale_timesteps: ${diffusion.rescale_timesteps}
  rescale_learned_sigmas: ${diffusion.rescale_learned_sigmas}


hydra:
  launcher:
    gres: gpu:1 
    mem_gb: 12
    cpus_per_task: 6
    timeout_min: 1440
    partition: gpu_normal